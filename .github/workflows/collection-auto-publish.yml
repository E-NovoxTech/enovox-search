name: Auto-publish scheduled collections

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Call auto-publish endpoint
        run: |
          curl -X POST "https://search.enovoxtech.com/collections/admin/auto-publish-due?admin_key=${{ secrets.ADMIN_KEY }}"