<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enovox Admin Dashboard</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="/static/assets/logo.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/apple-touch-icon.png">
    <link rel="manifest" href="/static/assets/site.webmanifest">
</head>
<body>

    <!-- Admin Login Overlay -->
    <div id="admin-login-overlay" class="overlay">
        <div class="modal-box">
            <h2>Admin Access</h2>
            <p>Enter your master admin key to access the control room.</p>
            <input type="password" id="admin-key-input" placeholder="Enter admin_key..." class="admin-input">
            <button id="save-key-btn" class="btn-primary">Enter Dashboard</button>
            <div id="login-error" class="error-text hidden"></div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard-layout" class="hidden">
        
        <!-- NEW: Mobile Header -->
        <div class="mobile-admin-header">
            <button id="admin-hamburger" aria-label="Open Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <span>Enovox Admin</span>
        </div>

        <!-- NEW: Sidebar Overlay for Mobile -->
        <div id="admin-sidebar-overlay" class="sidebar-overlay"></div>

        <!-- ADDED ID: id="admin-sidebar" -->
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="sidebar-brand">Enovox Admin</div>
            <nav class="sidebar-nav">
                <!-- Tabs remain the same -->
                <button class="nav-tab active" data-target="products-tab">Products</button>
                <button class="nav-tab" data-target="submissions-tab">Submissions</button>
                <button class="nav-tab" data-target="developers-tab">Developers</button>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-admin-btn" class="btn-danger">Clear Admin Key</button>
            </div>
        </aside>

        <!-- Main Content Area remains the same -->
        <main class="admin-main">

        <!-- Main Content Area -->
        <main class="admin-main">
            <div id="global-alert" class="alert hidden"></div>

            <!-- PRODUCTS TAB -->
            <section id="products-tab" class="tab-content active">
                <div class="section-header">
                    <h2>All Products</h2>
                    <button id="open-create-modal-btn" class="btn-primary">+ Add Product Manually</button>
                </div>
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Status</th>
                                <th>Badges</th>
                                <th>Date Added</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- SUBMISSIONS TAB -->
            <section id="submissions-tab" class="tab-content hidden">
                <div class="section-header">
                    <h2>Submissions</h2>
                    <div class="filter-toggles">
                        <label><input type="radio" name="sub-filter" value="pending" checked> Pending Only</label>
                        <label><input type="radio" name="sub-filter" value="all"> All History</label>
                    </div>
                </div>
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Developer</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="submissions-table-body">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- DEVELOPERS TAB -->
            <section id="developers-tab" class="tab-content hidden">
                <div class="section-header">
                    <h2>Registered Developers</h2>
                </div>
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Email</th>
                                <th>Signup Date</th>
                            </tr>
                        </thead>
                        <tbody id="developers-table-body">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Create / Edit Product Modal -->
    <div id="product-modal" class="overlay hidden">
        <div class="modal-box large">
            <div class="modal-header">
                <h2 id="modal-title">Create New Product</h2>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            
            <form id="admin-product-form" class="admin-form">
                <input type="hidden" id="edit_product_id" name="id">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Contact Email (For manual entry)</label>
                        <input type="email" name="contact_email">
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select name="category" required>
                            <option value="" disabled selected>Select a category</option>
                            <!-- Options will be injected dynamically by JS -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Product Type *</label>
                        <select name="product_type" required>
                            <option value="Software">Software</option>
                            <option value="App">App</option>
                            <option value="Platform">Platform</option>
                            <option value="Tool">Tool</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Pricing *</label>
                        <select name="pricing" required>
                            <option value="Free">Free</option>
                            <option value="Paid">Paid</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>User Count Range</label>
                        <select name="user_count_range">
                            <option value="Just launched">Just launched</option>
                            <option value="100+">100+</option>
                            <option value="1,000+">1,000+</option>
                            <option value="10,000+">10,000+</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Website URL *</label>
                        <input type="url" name="website" required>
                    </div>
                    <div class="form-group">
                        <label>Logo URL *</label>
                        <input type="url" name="logo_url" required>
                    </div>
                    <div class="form-group">
                        <label>App Store URL</label>
                        <input type="url" name="appstore_url">
                    </div>
                    <div class="form-group">
                        <label>Play Store URL</label>
                        <input type="url" name="playstore_url">
                    </div>
                    <div class="form-group">
                        <label>Founder Name(s)</label>
                        <input type="text" name="founder">
                    </div>
                    <div class="form-group">
                        <label>Platform (e.g., Web, iOS, Android)</label>
                        <input type="text" name="platform">
                    </div>
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" name="company_name" placeholder="e.g., Paystack Payments Limited">
                    </div>
                    <div class="form-group">
                        <label>X / Twitter URL</label>
                        <input type="url" name="twitter_url" placeholder="https://x.com/...">
                    </div>
                    <div class="form-group">
                        <label>LinkedIn URL</label>
                        <input type="url" name="linkedin_url" placeholder="https://linkedin.com/company/...">
                    </div>
                    <div class="form-group">
                        <label>Instagram URL</label>
                        <input type="url" name="instagram_url" placeholder="https://instagram.com/...">
                    </div>
                    <div class="form-group">
                        <label>Facebook URL</label>
                        <input type="url" name="facebook_url" placeholder="https://facebook.com/...">
                    </div>
                </div>
                <div class="form-group full-width">
                    <label>Description *</label>
                    <textarea name="description" rows="4" required></textarea>
                </div>
                
                <div class="modal-actions">
                    <button type="submit" class="btn-primary" id="save-product-btn">Save Product</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/static/js/config.js"></script>
    <script src="/static/js/admin.js"></script>
</body>
</html>
